name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then export CXX=clang++; else export CXX=g++; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAPEX_ARCH=v2

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DAPEX_ARCH=v2

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Core tests (perft, fuzz, SEE, draws)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: UCI conformance
        shell: bash
        run: |
          python -m pip install chess
          if [ -f build/Release/apex.exe ]; then EXE=build/Release/apex.exe; else EXE=build/apex; fi
          python tests/uci_test.py "$EXE"

      - name: Bench signature
        shell: bash
        run: |
          if [ -f build/Release/apex.exe ]; then EXE=build/Release/apex.exe; else EXE=build/apex; fi
          "$EXE" bench | tail -n 1

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan/UBSan
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DAPEX_SANITIZE=ON -DAPEX_ARCH=v2
          cmake --build build -j 4
      - name: Core tests under sanitizers
        run: ./build/test_core
